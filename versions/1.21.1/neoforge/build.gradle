plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.147'
}

// Shared mod metadata (single source of truth for every version/loader module).
def sharedProps = new Properties()
file('../../../gradle/mod.properties').withInputStream { sharedProps.load(it) }
sharedProps.each { key, value -> ext.set(key.toString(), value.toString()) }

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-${minecraft_version}-neoforge"
}

// Minecraft 1.21.1 is compiled for Java 21.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}

neoForge {
    // Skip NeoForm's decompile/recompile pipeline — a compile classpath is all this
    // module needs, and the alternative pipeline is far cheaper.
    enable {
        version = neoforge_version
        disableRecompilation = true
    }

    runs {
        client {
            client()
        }
        server {
            server()
        }
        data {
            data()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

// Version- and loader-independent algorithm shared by every module.
sourceSets.main.java.srcDir file('../../../core/src/main/java')
// Shared vanilla-only adapters. The shared TextureScalingPack targets the 1.20.1 Pack
// factory that 1.21.1 removed, so the incompatible file is excluded and a module-local
// OverlayPack (1.21.1 PackLocationInfo/PackSelectionConfig API) is compiled instead.
sourceSets.main.java.srcDir file('../../../common/src/main/java')
sourceSets.main.java.exclude 'com/evernight/texturescaler/common/TextureScalingPack.java'

tasks.named('processResources', ProcessResources).configure {
    filteringCharset = 'UTF-8'
    def replaceProperties = [
            minecraft_version      : minecraft_version, minecraft_version_range: minecraft_version_range,
            neoforge_version       : neoforge_version, neoforge_version_range: neoforge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id, mod_name: mod_name, mod_license: mod_license,
            mod_version            : mod_version, mod_authors: mod_authors,
            mod_description        : mod_description, mod_display_name: mod_display_name,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
