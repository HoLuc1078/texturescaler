org.gradle.jvmargs=-Xmx3G -Dfile.encoding=UTF-8
org.gradle.daemon=false
# ForgeGradle's startup certificate probe of https://maven.minecraftforge.net/ fails
# intermittently on this machine; the probe only checks reachability, all real downloads
# still go through normal TLS.
systemProp.net.minecraftforge.gradle.check.certs=false

minecraft_version=1.16.5
minecraft_version_range=[1.16.5,1.17)
forge_version=36.2.39
forge_version_range=[36,)
loader_version_range=[36,)
mapping_channel=official
mapping_version=1.16.5
